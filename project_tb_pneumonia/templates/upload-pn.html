{% extends "layout.html" %}

{% block title %}Upload-File{% endblock %}

{% block content %}
<style>


</style>
<div class="container-fluid my-5">
  <div class="row">
    <nav id="sidebarMenu" class="col-md-3 col-lg-2 d-md-block" style="height:100vh;">
      <div class="position-sticky pt-3">
        <ul class="nav flex-column">
          <li class="nav-item">
            <a class="nav-link" href="{{url_for('uploadpn')}}">
              Upload Image
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="{{url_for('history')}}">
              View History
            </a>
          </li>

        </ul>
      </div>
    </nav>

    <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4">
        <div class="row">
            <div class="col-md-4"></div>
            <div class="col-md-4">

                <form action="{{url_for('uploadpn')}}" method="post" enctype="multipart/form-data">
                    <div class="form-group">
                        <input class="form-control" type="file" name="file" accept="image/png">
                    </div><br>
                    <button class="btn btn-success" type="submit" style="margin:auto;display:block;">Submit</button>
                </form>
            </div>
            <div class="col-md-4"></div>
        </div><br>
        <div class="row">
            <div class="col-md-4"></div>
            <div class="col-md-4">
                {% if file_path|length %}
                    <img src="/{{file_path}}" style="margin:auto;display:block;width:400px;height:400px">
                <br><br>

                <b>
                    <p style="background-color:orange;width:500px" class="text-center">Result :-  {{file_result}}</p>
                </b>
                <br><br>
                <p class="text-center">Note : This is a software generated result.</p>
               <br><br>
                {% endif %}
            </div>
            <div class="col-md-4"></div>
        </div>
    </main>
  </div>
</div>
{% endblock %}
